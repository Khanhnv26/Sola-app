server.port=8081

spring.application.name=sola-reference
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Kết nối PostgreSQL local trên cổng 5432 (dùng riêng DB sola_ref cho bộ đối soát)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sola_ref}
spring.datasource.username=${DB_USERNAME:sola}
spring.datasource.password=${DB_PASSWORD:sola}

logging.level.org.hibernate.SQL=debug
springdoc.swagger-ui.path=/swagger-ui.html

sola.cors.allowed-origins=http://localhost:5173
