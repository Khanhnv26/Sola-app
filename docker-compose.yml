services:
  postgres:
    image: postgres:16-alpine
    container_name: sola-postgres
    environment:
      POSTGRES_DB: sola
      POSTGRES_USER: sola
      POSTGRES_PASSWORD: sola
    ports:
      # Map sang 5433 vì cổng 5432 trên máy local đang có Postgres khác lắng nghe
      - "5433:5432"
    volumes:
      - sola-pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sola -d sola"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sola-redis
    ports:
      - "6379:6379"
    profiles:
      - cache

volumes:
  sola-pg-data:
