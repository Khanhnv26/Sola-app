server.port=8080

spring.application.name=sola-backend
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Kết nối PostgreSQL local trên cổng 5432 (tạo DB bằng scripts/init-local-db.sql
# hoặc truyền DB_USERNAME / DB_PASSWORD của tài khoản postgres sẵn có)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sola}
spring.datasource.username=${DB_USERNAME:sola}
spring.datasource.password=${DB_PASSWORD:sola}

logging.level.org.hibernate.SQL=debug
springdoc.swagger-ui.path=/swagger-ui.html
